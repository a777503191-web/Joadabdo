name: CI/CD Production Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip and Locate Project
      run: |
        unzip -q "*.zip" -d extracted_project
        PROJECT_DIR=$(find extracted_project -name "package.json" -exec dirname {} \;)
        cp -r $PROJECT_DIR/* .
        rm -rf extracted_project

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install and Build Web Asset Pack
      run: |
        npm install --legacy-peer-deps
        npm install react-is --save-dev --legacy-peer-deps
        npm run build

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android Environment
      run: |
        npm install -g @capacitor/cli
        echo '{"appId": "com.jam.pro", "appName": "JAM-Pro", "webDir": "dist"}' > capacitor.config.json
        npx cap add android || echo "Android already added"
        npx cap sync android
        sed -i 's/<application/<application android:hardwareAccelerated="true" android:largeHeap="true"/' android/app/src/main/AndroidManifest.xml

    - name: Build Android App (APK Debug)
      run: |
        cd android
        chmod +x gradlew
        # استخدام assembleDebug لإنتاج نسخة موقعة تلقائياً تقبل التثبيت
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JAM-Pro-Debug-APK
        path: android/app/build/outputs/apk/debug/*.apk
