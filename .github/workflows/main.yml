    - name: Setup Android Environment
      run: |
        # 1. تثبيت الـ CLI الخاص بـ Capacitor
        npm install -g @capacitor/cli
        
        # 2. تثبيت مكتبات الأندرويد الخاصة بـ Capacitor محلياً في المشروع
        npm install @capacitor/android
        
        # 3. إعداد ملف التكوين
        echo '{"appId": "com.jam.pro", "appName": "JAM-Pro", "webDir": "dist"}' > capacitor.config.json
        
        # 4. إضافة منصة الأندرويد (مع التأكد من التثبيت)
        npx cap add android
        
        # 5. مزامنة الملفات
        npx cap sync android
        
        # 6. التعديلات المطلوبة على الـ Manifest
        sed -i 's/<application/<application android:hardwareAccelerated="true" android:largeHeap="true"/' android/app/src/main/AndroidManifest.xml
